name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PyTorrent version
      placeholder: e.g. 0.4.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options: [Release download, From source (uv run), Docker]
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Relevant lines from pytorrent.log (see CONTRIBUTING.md for where to find it).
      render: text
