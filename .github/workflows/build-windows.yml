name: Build Windows exe

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned: libtorrent publishes win_amd64 wheels for cp310-cp313 only
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Check libtorrent import
        run: python -c "import libtorrent; print(libtorrent.version)"

      - name: Build
        run: pyinstaller pytorrent.spec --noconfirm

      - name: Smoke test
        shell: pwsh
        run: |
          $env:PYTORRENT_NO_BROWSER = "1"
          $proc = Start-Process -FilePath "dist\pytorrent\pytorrent.exe" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest "http://127.0.0.1:8765/api/torrents" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          $index = $null
          if ($ok) { $index = Invoke-WebRequest "http://127.0.0.1:8765/" -UseBasicParsing }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Error "API never became ready"; exit 1 }
          if ($index.Content -notmatch "PyTorrent") { Write-Error "index.html not served"; exit 1 }

      - name: Zip
        run: Compress-Archive -Path dist/pytorrent -DestinationPath pytorrent-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: pytorrent-windows-x64
          path: pytorrent-windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pytorrent-windows-x64
      - uses: softprops/action-gh-release@v2
        with:
          files: pytorrent-windows-x64.zip
