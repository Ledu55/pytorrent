name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  # release.yml reuses this to produce the assets it attaches
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: pytorrent-windows-x64
          - os: ubuntu-latest
            artifact: pytorrent-linux-x64
          - os: macos-latest
            artifact: pytorrent-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Pinned: libtorrent publishes wheels for cp310-cp313 only
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen --python 3.12

      - name: Check libtorrent import
        run: uv run --no-sync python -c "import libtorrent; print(libtorrent.version)"

      - name: Build
        run: uv run --no-sync --with pyinstaller pyinstaller pytorrent.spec --noconfirm

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PYTORRENT_NO_BROWSER = "1"
          $proc = Start-Process -FilePath "dist\pytorrent\pytorrent.exe" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest "http://127.0.0.1:8765/api/torrents" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          $index = $null
          if ($ok) { $index = Invoke-WebRequest "http://127.0.0.1:8765/" -UseBasicParsing }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Error "API never became ready"; exit 1 }
          if ($index.Content -notmatch "PyTorrent") { Write-Error "index.html not served"; exit 1 }

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          PYTORRENT_NO_BROWSER=1 dist/pytorrent/pytorrent &
          pid=$!
          for i in $(seq 1 30); do
            sleep 1
            if curl -fs http://127.0.0.1:8765/api/torrents >/dev/null; then ok=1; break; fi
          done
          index=$(curl -fs http://127.0.0.1:8765/ || true)
          kill $pid || true
          [ -n "$ok" ] || { echo "API never became ready"; exit 1; }
          echo "$index" | grep -q PyTorrent || { echo "index.html not served"; exit 1; }

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/pytorrent -DestinationPath ${{ matrix.artifact }}.zip

      - name: Archive (Unix)
        if: runner.os != 'Windows'
        # tar keeps the executable bit that zip would drop
        run: tar -czf ${{ matrix.artifact }}.tar.gz -C dist pytorrent

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
          retention-days: 7
