[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorrent"
version = "0.3.1"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "libtorrent>=2.0.9",
]

description = "A lightweight BitTorrent client with a web UI, built on libtorrent"
readme = "README.md"
license = "MIT"

[project.scripts]
pytorrent = "launcher:main"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
]

[tool.setuptools]
packages = ["api", "torrent"]
py-modules = ["launcher", "main"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
